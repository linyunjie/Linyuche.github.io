                <p>魚菜共生(Aquaponics)系統的創意，是整合漁業養殖(Aquaculture)以及水耕栽培(Hydroponics) 兩者的需求，創造半封閉式的生態循環系統，利用水循環引導進入種植床，一方面提肥料，另一方面讓水質自淨，形成週而復始的良性循環。
